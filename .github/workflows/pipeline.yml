name: Refresh event data

on:
  schedule:
    # 06:00 and 16:00 NZDT. During NZST these run at 05:00 and 15:00 local time.
    - cron: '0 3,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: event-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rebuild static data atomically
        run: npm run pipeline
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EVENTFINDA_USERNAME: ${{ secrets.EVENTFINDA_USERNAME }}
          EVENTFINDA_PASSWORD: ${{ secrets.EVENTFINDA_PASSWORD }}
          EVENTFINDA_LOCATION_ID: ${{ vars.EVENTFINDA_LOCATION_ID }}
          AI_EXTRACTION_ENABLED: 'false'
      - run: npm run check
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: refresh Auckland events"
          git push
