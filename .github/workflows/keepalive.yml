name: Keep scheduled workflows active

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-writes
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record weekly repository activity
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/.keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          git commit -m "chore: keep scheduled workflows active"
          git push
